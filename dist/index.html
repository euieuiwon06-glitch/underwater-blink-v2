<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#bfeeff" />
    <meta
      name="description"
      content="눈을 깜빡이면 수면 중앙에서 파장이 퍼지는 웹캠 기반 인터랙티브 웹 아트"
    />
    <title>Underwater Blink</title>
    <link rel="preload" href="./assets/water-surface.png" as="image" fetchpriority="high" />
    <link rel="stylesheet" href="./styles.css?v=6" />
  </head>
  <body>
    <main class="experience" aria-label="눈 깜빡임에 반응하는 수면">
      <canvas id="water-canvas" aria-hidden="true"></canvas>
      <video id="camera-feed" playsinline muted aria-hidden="true"></video>

      <div class="status" id="status" role="status" aria-live="polite">
        <span id="status-text">카메라를 켜는 중</span>
      </div>

      <button class="retry-button" id="retry-button" type="button" hidden>
        다시 시도
      </button>

    </main>

    <script type="module" src="./app.js?v=11"></script>
  </body>
</html>
